# Optional: isolated Postgres container.
# Default local setup uses host Postgres on 5432 with DB `trendplan` (.env).
# Only start this if 5432 is free (or change the host port below).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trendplan
      POSTGRES_PASSWORD: trendplan
      POSTGRES_DB: trendplan
    ports:
      - "5432:5432"
    volumes:
      - trendplan_pg:/var/lib/postgresql/data

volumes:
  trendplan_pg:
