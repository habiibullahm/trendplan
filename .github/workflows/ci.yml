name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trendplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trendplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trendplan
      AUTH_SECRET: ci-auth-secret-not-for-production-use-32b
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      TRANSACTIONAL_EMAIL_ENABLED: "false"
      NEXT_PUBLIC_TRANSACTIONAL_EMAIL_ENABLED: "false"
      EMAIL_VERIFICATION_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck, unit, e2e, build)
        run: npm run verify
